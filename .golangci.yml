# golangci-lint v2 configuration for rikugan.
#
# Conservative default — enables the linters that catch real bugs (govet,
# staticcheck, errcheck) and idiomatic-Go violations (revive, unused),
# without the opinionated style noise that breaks contributors' flow.
# Formatters (gofmt, goimports) live under their own top-level key in v2.
# Loosen/tighten as needed; for the full rationale and a per-linter
# breakdown, see the samber/cc-skills-golang@golang-lint skill.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # vet's static analysis
    - ineffassign    # ineffective assignments
    - staticcheck    # catches a lot of real bugs (includes ex-gosimple checks)
    - unused         # unused vars, funcs, types
    - misspell       # English spelling
    - revive         # idiomatic-Go linter (replacement for golint)
    - unconvert      # unnecessary type conversions
    - unparam        # unused function parameters
  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          arguments:
            - "disableStutteringCheck" # audited manually in PR #1
    misspell:
      locale: UK # codebase uses British English throughout (organisation,
                 # initialised, analyse, …) — keep that consistent.
  exclusions:
    rules:
      # Test files can be looser.
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
