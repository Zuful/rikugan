name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false # we already checked out above; the action's
                               # internal checkout conflicts with the runner-
                               # injected Authorization header (HTTP 400).

  gosec:
    name: gosec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # We install gosec as a binary rather than using the marketplace
      # action — the `securego/gosec@v2` major-version tag the skill
      # template references does not actually exist in the action repo
      # (only specific semver tags do). Installing the upstream Go
      # binary sidesteps version-pinning churn.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  bearer:
    name: Bearer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bearer Security Scan
        uses: bearer/bearer-action@v2
