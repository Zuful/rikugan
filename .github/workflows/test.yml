name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration (kind)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Run integration tests
        run: go test -tags integration -run Integration -v -count=1 ./...

      - name: Smoke-test rikugan serve on Docker Compose
        run: test/compose-smoke.sh

      - name: Smoke-test the local lab
        run: test/lab-smoke.sh

      - name: Verify the systemd unit
        run: |
          go build -o rikugan ./cmd/rikugan
          sudo install -m 0755 rikugan /usr/local/bin/rikugan
          systemd-analyze verify deploy/systemd/rikugan-serve.service

  e2e:
    name: E2E (kind + Prometheus)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e
          config: test/e2e/kind.yaml

      - name: Build and load the test workload
        run: |
          docker build -f test/e2e/app/Dockerfile -t rikugan-e2e-app:test .
          kind load docker-image rikugan-e2e-app:test --name e2e

      - name: Deploy Prometheus
        run: |
          kubectl apply -f test/e2e/prometheus.yaml
          kubectl -n monitoring rollout status deployment/prometheus --timeout=180s

      - name: Run the end-to-end test
        run: go test -tags e2e -v -count=1 -timeout 20m ./test/e2e/

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the Helm chart
        run: |
          helm lint helm/rikugan
          helm lint helm/rikugan --set serve.enabled=true --set prometheus.url=http://prometheus:9090
          helm lint helm/rikugan --set serve.enabled=true --set prometheus.url=http://prometheus:9090 --set serve.escalation.enabled=true
          test/opencode-config-sync.sh

      - name: Smoke-test rikugan serve from the Helm chart
        run: |
          docker build -t rikugan:test .
          kind load docker-image rikugan:test --name e2e
          test/e2e/helm-smoke.sh
