apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rikugan.fullname" . }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rikugan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rikugan.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rikugan.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          stdin: true
          {{- if .Values.prometheus.url }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
