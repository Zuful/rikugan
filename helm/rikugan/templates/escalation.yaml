{{- if include "rikugan.escalationOn" . }}
{{- $opencode := include "rikugan.opencodeName" . }}
{{- $serve := include "rikugan.serveName" . }}
{{- $esc := .Values.serve.escalation }}
{{- if not $esc.existingSecret }}
{{- $name := include "rikugan.escalationSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The OpenCode server password and the agent MCP token, shared by
# rikugan serve and OpenCode: generated once and kept, as the verdicts
# API token is (use serve.escalation.existingSecret with GitOps).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "opencode-password") (index $existing.data "agent-mcp-token") }}
  opencode-password: {{ index $existing.data "opencode-password" }}
  agent-mcp-token: {{ index $existing.data "agent-mcp-token" }}
  {{- else }}
  opencode-password: {{ randAlphaNum 48 | b64enc }}
  agent-mcp-token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
---
{{- end }}
# OpenCode's config, generated: rikugan's MCP server is its only one,
# every native tool is off and denied. The token comes from the
# environment ({env:…}), never written here. rikugan checks this before
# each investigation and blocks escalation when it does not hold.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $opencode }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
data:
  opencode.json: |
    {{- $natives := list "invalid" "question" "bash" "read" "glob" "grep" "edit" "write" "task" "webfetch" "todowrite" "todoread" "websearch" "skill" "apply_patch" "list" "patch" "multiedit" "lsp" "codesearch" }}
    {{- $tools := dict }}
    {{- range $natives }}{{- $_ := set $tools . false }}{{- end }}
    {{- $permission := dict }}
    {{- range list "read" "edit" "glob" "grep" "list" "bash" "task" "external_directory" "todowrite" "question" "webfetch" "websearch" "lsp" "doom_loop" "skill" }}{{- $_ := set $permission . "deny" }}{{- end }}
    {{- $mcp := dict "rikugan" (dict "type" "remote" "enabled" true "oauth" false
          "url" (printf "http://%s:%v/mcp" $serve $esc.mcpPort)
          "headers" (dict "Authorization" "Bearer {env:RIKUGAN_AGENT_MCP_TOKEN}")) }}
    {{- $cfg := dict "$schema" "https://opencode.ai/config.json" "autoupdate" false "share" "disabled" "tools" $tools "permission" $permission "mcp" $mcp }}
    {{- with $esc.opencode.model }}{{- $_ := set $cfg "model" . }}{{- end }}
    {{- with $esc.opencode.provider }}{{- $_ := set $cfg "provider" . }}{{- end }}
    {{- $cfg | toPrettyJson | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $opencode }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rikugan.opencodeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rikugan.labels" . | nindent 8 }}
        app.kubernetes.io/component: opencode
      annotations:
        checksum/config: {{ toJson $esc.opencode | sha256sum }}
    spec:
      # No Kubernetes credential: the agent reaches the cluster only
      # through rikugan's read-only tools.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # OpenCode writes into its config directory as it loads it (a
      # .gitignore, its plugin dependencies), so the generated config is
      # copied from the ConfigMap into a writable emptyDir first.
      initContainers:
        - name: config
          image: "{{ $esc.opencode.image.repository }}:{{ $esc.opencode.image.tag }}"
          imagePullPolicy: {{ $esc.opencode.image.pullPolicy }}
          command: ["cp", "/etc/opencode-config/opencode.json", "/home/opencode/.config/opencode/opencode.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/opencode-config
              readOnly: true
            - name: xdg-config
              mountPath: /home/opencode/.config/opencode
      containers:
        - name: opencode
          image: "{{ $esc.opencode.image.repository }}:{{ $esc.opencode.image.tag }}"
          imagePullPolicy: {{ $esc.opencode.image.pullPolicy }}
          # Its logs go to stderr, where kubectl logs reads them.
          args: ["serve", "--pure", "--hostname", "0.0.0.0", "--port", "4096", "--print-logs", "--log-level", "WARN"]
          workingDir: /work
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rikugan.escalationSecretName" . }}
                  key: opencode-password
            - name: RIKUGAN_AGENT_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rikugan.escalationSecretName" . }}
                  key: agent-mcp-token
            - name: HOME
              value: /home/opencode
            - name: XDG_CONFIG_HOME
              value: /home/opencode/.config
            - name: XDG_DATA_HOME
              value: /home/opencode/.local/share
            - name: XDG_CACHE_HOME
              value: /home/opencode/.cache
            - name: XDG_STATE_HOME
              value: /home/opencode/.local/state
            {{- with $esc.opencode.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $esc.opencode.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: xdg-config
              mountPath: /home/opencode/.config/opencode
            - name: home
              mountPath: /home/opencode
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $esc.opencode.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $opencode }}
        - name: xdg-config
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $opencode }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
spec:
  selector:
    {{- include "rikugan.opencodeSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4096
      targetPort: http
{{- if $esc.networkPolicy.enabled }}
---
# OpenCode's API runs commands: only rikugan serve reaches it. OpenCode
# reaches DNS, the agent MCP port, and HTTPS outside private ranges,
# where the LLM providers are: a NetworkPolicy filters addresses, not
# domain names, so "the provider alone" needs an egress proxy or an FQDN
# policy (Cilium), documented as options.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $opencode }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
spec:
  podSelector:
    matchLabels:
      {{- include "rikugan.opencodeSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rikugan.serveSelectorLabels" . | nindent 14 }}
      ports:
        - port: 4096
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "rikugan.serveSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $esc.mcpPort }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $esc.networkPolicy.except | nindent 14 }}
      ports:
        - port: 443
          protocol: TCP
    {{- with $esc.networkPolicy.llmEndpoint }}
    # The self-hosted model: the one exception to the private ranges.
    - to:
        {{- if .cidr }}
        - ipBlock:
            cidr: {{ .cidr }}
        {{- else }}
        - {{- with .namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
---
# rikugan serve: the verdicts API stays open as before; the agent MCP
# port, which reaches every backend, answers OpenCode alone (its token
# is required as well).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $serve }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  podSelector:
    matchLabels:
      {{- include "rikugan.serveSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "rikugan.opencodeSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $esc.mcpPort }}
          protocol: TCP
{{- end }}
{{- end }}
