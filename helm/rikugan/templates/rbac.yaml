{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rikugan.fullname" . }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rikugan.fullname" . }}
  labels:
    {{- include "rikugan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rikugan.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rikugan.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
